name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Check formatting
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build production artifacts
        run: pnpm build
      - name: Verify OpenAPI is current
        run: pnpm check:openapi
      - name: Run source Trust Test
        run: pnpm trust:test

  docker-integration:
    name: Docker integration
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Docker Trust Test
        run: pnpm trust:test:docker
      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload sanitized Trust Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-test-docker-${{ github.run_id }}
          path: |
            reports/release-0.1-docker-gate.json
            reports/release-0.1-docker-gate.md
          if-no-files-found: warn
          retention-days: 7

  portability-docker:
    name: Release 0.2 portability Docker gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: docker-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Enable pinned Corepack package manager
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm@10.15.0 install --frozen-lockfile
      - name: Run destructive portability gate
        run: corepack pnpm@10.15.0 trust:test:portability:docker
      - name: Upload sanitized portability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-test-portability-${{ github.run_id }}
          path: |
            reports/release-0.2-portability-gate.json
            reports/release-0.2-portability-gate.md
          if-no-files-found: error
          retention-days: 14
