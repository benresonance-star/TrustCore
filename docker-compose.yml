name: trust-core

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trust_core}
      POSTGRES_USER: ${POSTGRES_USER:-trust_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trust_admin_local_only}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - trust_postgres:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trustcore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trustcore-local-secret}
    ports:
      - "${MINIO_API_PORT:-5900}:9000"
      - "${MINIO_CONSOLE_PORT:-5901}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - trust_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trustcore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trustcore-local-secret}
      TRUST_STORAGE_BUCKET: ${TRUST_STORAGE_BUCKET:-trust-core-local}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${TRUST_STORAGE_BUCKET}"
        mc anonymous set none "local/$${TRUST_STORAGE_BUCKET}"
    restart: "no"

volumes:
  trust_postgres:
  trust_minio:
